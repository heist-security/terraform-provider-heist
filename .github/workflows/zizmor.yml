name: Zizmor

# Adapted from heist-go. Runs on every pull request, without a paths filter, so
# the check always reports and can be required by the main ruleset.
on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  audit:
    name: Audit GitHub Actions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          annotations: true
